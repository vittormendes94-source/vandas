# Publica o sistema na Cloudflare (plano gratuito) a partir do GitHub, sem instalar nada no computador.
# Só roda quando VOCÊ clica em "Run workflow" na aba Actions e digita PUBLICAR. Push não publica nada.
# Segredos usados (Settings → Secrets and variables → Actions): veja docs/PUBLICACAO.md.
name: Publicar na Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite PUBLICAR para confirmar'
        required: true

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    if: inputs.confirmar == 'PUBLICAR'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Conferir segredos obrigatórios
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          VIEW_TOKEN: ${{ secrets.VIEW_TOKEN }}
          EWELINK_APP_ID: ${{ secrets.EWELINK_APP_ID }}
          EWELINK_APP_SECRET: ${{ secrets.EWELINK_APP_SECRET }}
        run: |
          falta=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_TOKEN VIEW_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Falta o segredo $v (veja docs/PUBLICACAO.md)"; falta=1; fi
          done
          for v in ADMIN_TOKEN VIEW_TOKEN; do
            val="${!v}"
            if [ -n "$val" ] && [ ${#val} -lt 24 ]; then echo "::error::$v precisa ter pelo menos 24 caracteres"; falta=1; fi
          done
          if [ -z "$EWELINK_APP_ID" ] || [ -z "$EWELINK_APP_SECRET" ]; then
            echo "::warning::EWELINK_APP_ID/EWELINK_APP_SECRET ainda não cadastrados: o painel publica, mas a conexão eWeLink fica para depois (rode de novo quando tiver)."
          fi
          exit $falta

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar (tipos e testes)
        run: |
          npm run typecheck
          npm test

      - name: Compilar a interface
        run: npm run build

      - name: Banco D1 (cria na primeira vez) e migrações
        working-directory: apps/worker
        run: |
          find_id() {
            npx wrangler d1 list --json | node -e '
              let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const j = JSON.parse(s.slice(s.indexOf("[")));
                const db = (Array.isArray(j) ? j : j.result ?? []).find((d) => d.name === "orquidario");
                process.stdout.write(db ? (db.uuid ?? db.id ?? "") : "");
              });'
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            echo "Criando o banco D1 'orquidario'…"
            npx wrangler d1 create orquidario
            id="$(find_id)"
          fi
          if ! printf %s "$id" | grep -Eq '^[0-9a-f-]{36}$'; then echo "::error::Não foi possível obter o id do banco D1"; exit 1; fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml
          npx wrangler d1 migrations apply orquidario --remote

      - name: Publicar (Worker + interface + segredos)
        working-directory: apps/worker
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          VIEW_TOKEN: ${{ secrets.VIEW_TOKEN }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          EWELINK_APP_ID: ${{ secrets.EWELINK_APP_ID }}
          EWELINK_APP_SECRET: ${{ secrets.EWELINK_APP_SECRET }}
          EWELINK_APP_EXPIRES_AT: ${{ vars.EWELINK_APP_EXPIRES_AT }}
        run: |
          secrets="$RUNNER_TEMP/segredos.json"
          umask 077
          node -e '
            const keys = ["ADMIN_TOKEN", "VIEW_TOKEN", "INGEST_TOKEN", "EWELINK_APP_ID", "EWELINK_APP_SECRET"];
            const out = Object.fromEntries(keys.filter((k) => process.env[k]).map((k) => [k, process.env[k]]));
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out));
          ' "$secrets"
          extra=()
          if [ -n "$EWELINK_APP_EXPIRES_AT" ]; then extra+=(--var "EWELINK_APP_EXPIRES_AT:$EWELINK_APP_EXPIRES_AT"); fi
          set +e
          npx wrangler deploy --secrets-file "$secrets" "${extra[@]}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          status=${PIPESTATUS[0]}
          set -e
          rm -f "$secrets"
          if [ "$status" -ne 0 ]; then
            if grep -qi "workers.dev" "$RUNNER_TEMP/deploy.log" && grep -qi "subdomain" "$RUNNER_TEMP/deploy.log"; then
              echo "::error::Escolha o subdomínio workers.dev no painel da Cloudflare (Workers & Pages) e rode de novo."
            fi
            exit "$status"
          fi
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n1)"
          {
            echo "## Publicado"
            if [ -n "$url" ]; then
              echo ""
              echo "| | Endereço |"
              echo "|---|---|"
              echo "| Painel | $url |"
              echo "| TV | $url/?tv=1&k=<VIEW_TOKEN> |"
              echo "| Retorno a cadastrar no app eWeLink | $url/api/ewelink/callback |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
